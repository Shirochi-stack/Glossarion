# The mobile wheelhouse: the security pins (cryptography==50.0.2, pillow==13.0.0) and the on-device
# engine with vision (llama-cpp-python==0.3.37 with libmtmd).
#
# No index had Android/iOS cp313 wheels for these versions we could ship (pypi.flet.dev's
# llama-cpp-python builds stop at 0.3.32 and lack libmtmd: LLAVA_BUILD=OFF; its pillow-13.0.0-1 iOS builds lack
# AVIF, ImageCms, JPEG 2000 and LZMA), so .github/workflows/mobile-wheels.yml builds them with
# flet-dev/mobile-forge, except the [wheel.retag] targets (iOS Pillow), which are PyPI's official
# wheels retagged with build_tag. The mobile builds feed the wheelhouse to `flet build` through
# PIP_FIND_LINKS (.github/actions/mobile-wheelhouse). Nothing here is uploaded to an index or a release.
#
# Read by:
#   ci/wheels/wheels.py             env / fetch / stage-openssl / stage-opencl / stage-hexagon / collect / retag /
#                                   verify-native / verify-site-packages / assert-selftest
#   tools/check_mobile_wheels.py    --wheelhouse / --wheelhouse-plan / --verify-wheelhouse / --verify-installed
#
# Every sha256 below was checked on 2026-10-07 against the GitHub release asset digest
# (or PyPI's JSON API for the sdists) AND by hashing the downloaded bytes ([wheel.retag]: 2026-11-16).
# Changing any value here, build_wheels.sh, wheels.py or a recipe changes the wheel
# cache key, so the next run rebuilds.

schema = 1

# Every wheel we build or retag is tagged <name>-<version>-<build_tag>-cp313-cp313-<platform>.whl.
# pip ranks a higher build tag above an otherwise identical index file (an exact tie goes
# to the index), and pypi.flet.dev uses build tags <= 11 today.
build_tag = 1000

[toolchain]
python_build_release = "20260921"        # = flet_cli 1.0.3 utils/python_versions.py PYTHON_BUILD_RELEASE_DATE
python_version = "3.13.15"               # the CPython that release (and Flet 1.0.3 on device) ships
android_ndk = "27.3.13750724"            # NDK r27d; the support tree's sysconfigdata names this NDK
rust = "1.98.1"
ios_deployment_target = "13.0"           # wheel tag ios_13_0_*; every iOS recipe sets it in script_env
                                         # (wheels.py checks it), the only channel forge passes to rustc

[toolchain.mobile_forge]
repo = "https://github.com/flet-dev/mobile-forge"
rev = "0fadbfab0d63d11164030dfddc955ed980e32e2c"   # main, 2026-10-04 "recipe: thrift 0.25.0 (#126)"

[toolchain.crossenv]
repo = "https://github.com/flet-dev/crossenv"
rev = "e5e615651f794d060d9484eab463861fef2a2019"   # head of the moving 'flet' branch (2026-06-03)

# flet-dev/python-build release <python_build_release>: python-<platform>-mobile-forge-<python_version>.tar.gz
[toolchain.support_sha256]
android = "6f7dcf7e9dbe66e22c469c6bb7bdb40b8d8f887390afd1bfbefad72df4603035"
ios = "a7c5b6059357154eb419a26ed45dc748dcd32c70fbe8145b408589696dc3205f"

# Versions only (PIP_CONSTRAINT for forge's build environments). cffi stays at 2.0.0: the
# cffi code generated into cryptography at build time must load with the cffi 2.0.0 that
# pypi.flet.dev ships for the device. Bump the others deliberately.
[toolchain.pip_constraints]
maturin = "1.15.0"
cffi = "2.0.0"
setuptools = "84.0.0"
pybind11 = "3.1.0"
build = "1.6.1"

# BeeWare's prebuilt OpenSSL 3.5.9 (LTS, supported until 2030-04-08), linked statically into
# cryptography instead of the support tree's end-of-life 3.0.x. Only include/ and
# lib/lib{crypto,ssl}.a are kept (wheels.py stage-openssl).
[openssl]
version = "3.5.9"

[openssl.android]
repo = "beeware/cpython-android-source-deps"
tag = "openssl-3.5.9-0"
build = "0"

[openssl.android.assets]
"arm64-v8a" = { file = "openssl-3.5.9-0-aarch64-linux-android.tar.gz", sha256 = "bf115f29963d577e20a1595dac13baec7ccd559bf8a05f37659ba6b735a8778b" }
"x86_64" = { file = "openssl-3.5.9-0-x86_64-linux-android.tar.gz", sha256 = "11fe72e251fccb5d81fc43a67096a4ce540e09ddf3a8a587dede199774c89141" }

[openssl.ios]
repo = "beeware/cpython-apple-source-deps"
tag = "OpenSSL-3.5.9-1"
build = "1"

[openssl.ios.assets]
"iphoneos.arm64" = { file = "openssl-3.5.9-1-iphoneos.arm64.tar.gz", sha256 = "aa8c3a96138a5650f51a1416076f947fec9ae7a5fba83afb0015fefe314107dc" }
"iphonesimulator.arm64" = { file = "openssl-3.5.9-1-iphonesimulator.arm64.tar.gz", sha256 = "3617fe2d80bb2f0cd981f39d32b0bd651c36b86efe71b9d4025ca3befd229461" }
"iphonesimulator.x86_64" = { file = "openssl-3.5.9-1-iphonesimulator.x86_64.tar.gz", sha256 = "bd27471f292d501906a6d7ee36ce8ffe4d39ebb1c00ffe3c06e679b090d13f4d" }

# Khronos OpenCL headers and ICD loader (Apache-2.0), link-time only: the Android arm64
# llama-cpp-python build's optional OpenCL backend (libggml-opencl, Adreno) is compiled against
# the headers and linked against a libOpenCL.so (SONAME libOpenCL.so) built from the loader with
# the NDK. wheels.py stage-opencl puts both into the NDK sysroot before forge runs; neither ships:
# on the phone the vendor's /vendor/lib64/libOpenCL.so is loaded (uses-native-library). GitHub's
# tag archives, sha256 of the downloaded bytes checked 2026-10-20.
[opencl]
abis = ["arm64-v8a"]
headers = { url = "https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/tags/v2026.05.29.tar.gz", sha256 = "d9e6c48357de5002da11ce45de600e0c3ffe6ab4f628a3b9fe2b38603161658a", file = "OpenCL-Headers-2026.05.29.tar.gz" }
icd_loader = { url = "https://github.com/KhronosGroup/OpenCL-ICD-Loader/archive/refs/tags/v2026.05.29.tar.gz", sha256 = "48fd0c5181db7cd046f4f731d5955694892e10998d49d09ee0d997e7e04fd939", file = "OpenCL-ICD-Loader-2026.05.29.tar.gz" }

# The optional NPU backend (Qualcomm Hexagon HTP; llama.cpp's ggml-hexagon, in 0.3.37's llama.cpp a956a852):
# the Android arm64 llama-cpp-python build adds libggml-hexagon.so (an arm64 library next to libggml-opencl,
# it dlopens the phone's libcdsprpc.so itself) and the HTP skeletons, Hexagon DSP code the cDSP loads
# through FastRPC, shipped as package data llama_cpp/htp/libggml-htp-<arch>.so.dsp (recipe patch, 10.).
#
# THE SWITCH: enabled = false builds the engine exactly without it: no SDK download, GGML_HEXAGON OFF
# (stage-hexagon still writes the initial cache the arm64 recipe loads), and verify-native /
# verify-site-packages then expect no libggml-hexagon and no skeletons. x86_64 and iOS never build it.
#
# LICENCE: the skeletons link the Hexagon SDK's runtime (QuRT, the Hexagon tools' C library) statically.
# No release may ship them until the owner has confirmed that the Hexagon SDK licence allows it (and the
# CI use of this repackaged SDK tarball); see src/mobile/README.md "NPU (Snapdragon)".
#
# sdk: the Hexagon SDK 6.7.0.0 as llama.cpp's own Android toolchain image (snapdragon-toolchain/docker,
# HEXAGON_SDK_ROOT=/opt/hexagon/6.7.0.0, HEXAGON_TOOLS_ROOT=$HEXAGON_SDK_ROOT/tools/HEXAGON_Tools/21.0.04)
# installs it: github.com/snapdragon-toolchain/hexagon-sdk release v6.7.0.0 (2026-10-19), no account
# needed; 741,882,016 bytes; sha256 = the GitHub release asset digest, read on 2026-11-18 (not yet
# confirmed by hashing the downloaded bytes: the download is checked against it in every build).
# htp_archs: the skeletons ggml-hexagon's CMakeLists builds (v73 v75 v79 v81 v85; the backend clamps the
# arch the cDSP reports to v73..v85) and verify-native expects; editing it does not change what CMake builds.
[hexagon]
enabled = true
abis = ["arm64-v8a"]
version = "6.7.0.0"
tools = "21.0.04"
htp_archs = ["v73", "v75", "v79", "v81", "v85"]
sdk = { url = "https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v6.7.0.0/hexagon-sdk-v6.7.0.0-amd64-lnx.tar.xz", sha256 = "00725fc449916d7b9af2c2a3c6b54d61f3c872d5dbc1d3ca3fd2f839b1d5dc70", file = "hexagon-sdk-v6.7.0.0-amd64-lnx.tar.xz" }

# The wheels we promise. version must equal the pyproject pin, sdist_sha256 the uv.lock sdist
# hash, and requires_dist the wheel METADATA's Requires-Dist entries that carry no extra marker.
# serious_python installs all three iOS slices, so iOS needs all three.
[[wheel]]
name = "cryptography"
version = "50.0.2"
recipe = "recipes/cryptography"
sdist_sha256 = "7b46165bb56eb4704e2eaaf86f3c940d19154535d9b0ca7d6d590b04060e00d5"
targets = ["arm64-v8a", "x86_64", "iphoneos.arm64", "iphonesimulator.arm64", "iphonesimulator.x86_64"]
requires_dist = [
    "cffi>=2.0.0; platform_python_implementation != \"PyPy\"",
    "typing-extensions>=4.13.2; python_full_version < \"3.11\"",
]

# Android is built here and links the flet-lib* C libraries as published on pypi.flet.dev
# (follow-up: newer libjpeg-turbo / FreeType builds).
# iOS ships PyPI's official pillow-13.0.0 cp313 wheels (PIL._avif, PIL._imagingcms and the full
# codec set, statically linked). pypi.flet.dev's reduced pillow-13.0.0-1 would outrank them (build
# tag 1 > none) and lacks AVIF and ImageCms (verify-native checks both), so they are promised here:
# wheels.py retag downloads each [wheel.retag] url, checks its sha256 (PyPI JSON API, confirmed by
# hashing the downloaded bytes on 2026-11-16) and changes only the file name, WHEEL "Build:" and
# RECORD's WHEEL row to build_tag. No forge build for them; Requires-Dist: every entry has an extra.
[[wheel]]
name = "pillow"
version = "13.0.0"
recipe = "recipes/pillow"
sdist_sha256 = "cdcd1ba258178f7356d74170c9a81ba4eab6a5d55748bc402a5a2a6fe6be3510"
targets = ["arm64-v8a", "x86_64", "iphoneos.arm64", "iphonesimulator.arm64", "iphonesimulator.x86_64"]
requires_dist = ["flet-libjpeg==3.0.90", "flet-libfreetype==2.13.3", "flet-libwebp==1.6.0"]
requires_dist_ios = []

[wheel.retag]
"iphoneos.arm64" = { url = "https://files.pythonhosted.org/packages/82/e2/9132d38df320e8099e2642d9fa538f18a7dfebf68a875a31725dc2a115aa/pillow-13.0.0-cp313-cp313-ios_13_0_arm64_iphoneos.whl", sha256 = "e98b4f91f99b24b1da72e10621ba181f7281922384a7403094debb4199de6c00" }
"iphonesimulator.arm64" = { url = "https://files.pythonhosted.org/packages/cb/be/436dac0996876f65ef1916ffb711c5ef4af2ebc57414b6f16642e07f6b47/pillow-13.0.0-cp313-cp313-ios_13_0_arm64_iphonesimulator.whl", sha256 = "34fb3db1149c879343861831728c243c432d4a5afc8f1878ca7612ef8de2a033" }
"iphonesimulator.x86_64" = { url = "https://files.pythonhosted.org/packages/60/16/7c1007162e4169ea0d5bec47e2e0b2174f56c50cf5b8c02a1dc23e41037e/pillow-13.0.0-cp313-cp313-ios_13_0_x86_64_iphonesimulator.whl", sha256 = "2d50500a4a3bc6469adcdb319cf05d688b08ca3bf0f22a05339f3b25b433a599" }

# The built-in llama.cpp engine with the multimodal library (libmtmd) for vision models. Newer than
# pypi.flet.dev's 0.3.32 build 2 (the pyproject pin is 0.3.37: PLaMo 3's tokenizer needs its
# llama.cpp), built from forge's recipe with LLAVA_BUILD=ON (recipes/llama-cpp-python). A
# device-only pin: uv.lock has no entry, so the sdist URL and hash are here (PyPI JSON, checked
# 2026-11-17 against the downloaded bytes).
# Requires-Dist: forge adds the Android host requirement flet-libcpp-shared (libc++_shared.so).
[[wheel]]
name = "llama-cpp-python"
version = "0.3.37"
recipe = "recipes/llama-cpp-python"
sdist_sha256 = "bf4108fc76e933ea4969b61b1e281a2d232dd3e43361d1fdca5e2e029d62f729"
sdist_url = "https://files.pythonhosted.org/packages/7f/9a/3ebc0b3ef42b8d9cc7d15dc9b147b3e8ce11bfdb61eb381c3eb7d9762373/llama_cpp_python-0.3.37.tar.gz"
targets = ["arm64-v8a", "x86_64", "iphoneos.arm64", "iphonesimulator.arm64", "iphonesimulator.x86_64"]
requires_dist = ["typing-extensions>=4.5.0", "numpy>=1.20.0", "diskcache>=5.6.1", "jinja2>=2.11.3"]
requires_dist_android = ["typing-extensions>=4.5.0", "numpy>=1.20.0", "diskcache>=5.6.1", "jinja2>=2.11.3",
                         "flet-libcpp-shared>=27.2.12479018"]
