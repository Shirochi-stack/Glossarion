# Collector policy for the mobile backend bundle.
# Read by src/mobile/tools/collect_backend.py (see its docstring for the rules).
#
#   python tools/collect_backend.py --check            # policy only (CI: mobile-backend-check)
#   python tools/collect_backend.py --report build/backend_report.md   # + copy to app/backend
#   python tools/collect_backend.py --verify           # bundle == _bundle_info == src
#
# Baselines are ratchets: an entry lists today's unguarded lazy GUI/excluded edges and
# process-spawn sites with their site counts. A new edge/site, a new API in a listed
# function or a higher count fails the check. A spawn site on a branch selected by
# mobile_runtime.processes_available()/subprocesses_available() in the same function is
# "gated" and never counts (see the collector docstring); gating every site of a function
# makes its entry stale, and a lower count asks you to lower the number.

[entry]
# Backend entry points the mobile app drives (plan §2/§3). Everything they import
# (module-scope, conditional or lazy) is bundled unless excluded or GUI-tainted.
modules = [
  "TransateKRtoEN", "extract_glossary_from_epub", "extract_glossary_from_txt", "epub_converter",
  "scan_html_folder", "qa_scan_runtime", "GlossaryManager", "unified_glossary", "glossary_process_worker",
  "glossary_refinement", "glossary_compressor", "manga_translator", "ocr_manager", "bubble_detector",
  "local_inpainter", "image_translator", "txt_processor", "pdf_extractor", "pdf_workspace_compiler",
  "_pdf_worker", "pdf_generation_manager", "metadata_translation_worker", "metadata_batch_translator",
  "translate_headers_standalone", "model_options", "multi_api_key_manager", "unified_api_client",
  "history_manager", "subtitle_processor", "sdlxliff_converter", "sdlxliff_extractor", "image_archive_epub",
  "api_key_encryption", "token_encryption", "authgpt_auth", "authgem_auth", "authgrok_auth", "authcd_auth",
  "authnd_auth", "gemini_free", "google_free_translate", "app_version", "language_options",
  # Desktop runs these as subprocess scripts (chapter_extraction_manager.py:178,
  # sdlxliff_extraction_manager.py:46); on mobile they run in-process (U1).
  "chapter_extraction_worker", "sdlxliff_extraction_worker",
  # JobService interrupted-job resume (restore_in_progress_rows_for_shutdown).
  "shutdown_utils",
  # Later milestones: ZIP/HTML -> EPUB input prep (U3), Reader (U5), RPG Maker and the
  # Review generator (U7), manga OCR import/export (U8).
  "html_archive_epub", "workspace_reader", "rpgmaker_handler", "review_generator", "manga_ocr_io",
  # U1 shared GUI-free core (plan §2) and the runtime gates / PDF shim the patches use (§3).
  "mobile_runtime", "pdf_mupdf_html", "app_paths", "config_store", "prompt_defaults", "metadata_defaults",
  "ollama_settings", "key_pools", "output_naming",
  # U2 shared core: the owner state/env/persistence mixins TranslatorGUI inherits, the
  # HeadlessOwner the job thread builds, and the generated settings schema (plan §2).
  "owner_state", "run_env", "settings_persistence", "headless_owner", "settings_schema", "settings_schema_data",
  # GUI-free Library registry + source-EPUB resolver (run_env's EPUB compile env; the rest of
  # the Library logic follows in U5).
  "library_core",
  # U3 shared core: the Stop protocol and run-start resets, the job scope (JOB_LOCK,
  # scoped_process_state, ProgressWatcher), text/compile jobs, ZIP/HTML/subtitle input
  # preparation, the translation + glossary pipelines HeadlessOwner inherits, and the Direct
  # Text chat store (direct_text_chats.json v2) + log-stream model the chat uses (plan §2).
  "stop_control", "job_runner", "text_jobs", "input_preparation", "translation_pipeline",
  "direct_text_store", "direct_text_stream",
  # U4 shared core: settings rules (route controls, locks, chunk/compression, output and
  # glossary modes), the Model Manager catalog (tombstones, polled markers, provider refresh,
  # save order), prompt + assistant-prefill profiles, the key pools (specs, import/export
  # glossarion-key-pools v1, key tests, refusal defaults) and the OAuth begin/complete helpers
  # authgem/authcd/authgrok share. The profile screens load prompt_profiles via importlib.
  "settings_rules", "model_catalog_core", "prompt_profiles", "key_pool_service", "oauth_session",
  # U5 shared core: the Library (library_core above: scans, resolvers, card data, Book Details,
  # Organize / Undo / Delete / Import / Scan for raw), covers, the reader document (mobile page
  # shell, bilingual chapters) and live stream the Reader renders, and the Progress Manager /
  # Glossary Progress cores the Book page's Chapters and Glossary tabs bind to. The Library and
  # the Reader load them through services/library.SharedCore (importlib), hence listed here.
  "library_covers", "reader_doc", "live_stream", "progress_core", "progress_actions",
  "glossary_progress_core", "reader_overlay",
  # U6 shared core: the Glossary Editor document (parse / save / tools / find-replace / backups /
  # prompt-profile config helpers, lifted from GlossaryManager_GUI), the main window's glossary
  # file actions (editor backups, delete / restore glossary files, Map Glossaries, JSON repair,
  # lifted from translator_gui) and the Parallel EPUB pair core (parallel_epub_glossary). The
  # Glossary Manager screens load them through services/library.SharedCore (importlib).
  "glossary_document", "glossary_files", "parallel_epub_core",
]
# New shared modules from the plan that do not exist yet. They become entries automatically
# once the file exists (the report then asks to move them into `modules`).
planned = []
# Every `import X` of a src/ module inside the mobile app (files or package dirs, relative to
# src/mobile) becomes an entry too; the app's third-party imports must be pinned as well.
scan_package = ["app/main.py", "app/glossarion_mobile"]
# Top-level names that belong to the app itself, not to src/ or PyPI ("main" is app/main.py).
app_local = ["glossarion_mobile", "main", "flet_glossarion_native"]
extra_modules = []

# Non-literal __import__/importlib.import_module sites: "module:function" = [modules it can load].
[dynamic_imports]
"model_options:_authenticated_catalog_has_session" = ["authgpt_auth", "authcd_auth", "authgem_auth", "glm_proxy"]
"model_options:_fetch_authenticated_catalog" = ["authgpt_auth", "authcd_auth", "authgem_auth"]
# Named settings_map converters (settings_schema._CALL_CONVERTERS).
"settings_schema:_resolve_call" = ["run_env"]
# {'$ref': 'module:NAME'} defaults in settings_schema_data (resolved lazily, off the UI loop).
"settings_schema:_resolve_marker" = [
  "emoticon_patterns", "extract_glossary_from_epub", "glossary_refinement", "prompt_defaults",
  "refinement_prompts", "title_tag_translation",
]

