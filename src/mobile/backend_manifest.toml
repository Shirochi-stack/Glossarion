# Collector policy for the mobile backend bundle.
# Read by src/mobile/tools/collect_backend.py (see its docstring for the rules).
#
#   python tools/collect_backend.py --check            # policy only (CI: mobile-backend-check)
#   python tools/collect_backend.py --report build/backend_report.md   # + copy to app/backend
#   python tools/collect_backend.py --verify           # bundle == _bundle_info == src
#
# Baselines are ratchets: an entry lists today's unguarded lazy GUI/excluded edges and
# process-spawn sites with their site counts. A new edge/site, a new API in a listed
# function or a higher count fails the check. Gating a site (U1, plan §3) lowers the
# count: update the number (the report prints "lower the count" notes).

[entry]
# Backend entry points the mobile app drives (plan §2/§3). Everything they import
# (module-scope, conditional or lazy) is bundled unless excluded or GUI-tainted.
modules = [
  "TransateKRtoEN", "extract_glossary_from_epub", "extract_glossary_from_txt", "epub_converter",
  "scan_html_folder", "qa_scan_runtime", "GlossaryManager", "unified_glossary", "glossary_process_worker",
  "glossary_refinement", "glossary_compressor", "manga_translator", "ocr_manager", "bubble_detector",
  "local_inpainter", "image_translator", "txt_processor", "pdf_extractor", "pdf_workspace_compiler",
  "_pdf_worker", "pdf_generation_manager", "metadata_translation_worker", "metadata_batch_translator",
  "translate_headers_standalone", "model_options", "multi_api_key_manager", "unified_api_client",
  "history_manager", "subtitle_processor", "sdlxliff_converter", "sdlxliff_extractor", "image_archive_epub",
  "api_key_encryption", "token_encryption", "authgpt_auth", "authgem_auth", "authgrok_auth", "authcd_auth",
  "authnd_auth", "gemini_free", "google_free_translate", "app_version", "language_options",
  # Desktop runs these as subprocess scripts (chapter_extraction_manager.py:178,
  # sdlxliff_extraction_manager.py:46); on mobile they run in-process (U1).
  "chapter_extraction_worker", "sdlxliff_extraction_worker",
  # JobService interrupted-job resume (restore_in_progress_rows_for_shutdown).
  "shutdown_utils",
  # Later milestones: ZIP/HTML -> EPUB input prep (U3), Reader (U5), RPG Maker and the
  # Review generator (U7), manga OCR import/export (U8).
  "html_archive_epub", "workspace_reader", "rpgmaker_handler", "review_generator", "manga_ocr_io",
]
# New shared modules from the plan that do not exist yet. They become entries automatically
# once the file exists (the report then asks to move them into `modules`).
planned = ["mobile_runtime", "pdf_mupdf_html"]
# Every `import X` of a src/ module inside the mobile app (files or package dirs, relative to
# src/mobile) becomes an entry too; the app's third-party imports must be pinned as well.
scan_package = ["app/main.py", "app/glossarion_mobile"]
# Top-level names that belong to the app itself, not to src/ or PyPI ("main" is app/main.py,
# not the excluded src/main.py).
app_local = ["glossarion_mobile", "main", "flet_glossarion_native"]
extra_modules = []

# Non-literal __import__/importlib.import_module sites: "module:function" = [modules it can load].
[dynamic_imports]
"model_options:_authenticated_catalog_has_session" = ["authgpt_auth", "authcd_auth", "authgem_auth", "glm_proxy"]
"model_options:_fetch_authenticated_catalog" = ["authgpt_auth", "authcd_auth", "authgem_auth"]

