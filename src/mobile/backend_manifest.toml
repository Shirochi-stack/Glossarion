# Process-spawn sites (module:function) in bundled modules that the collector cannot see as
# gated: the gate is in the caller, in an object attribute or in a worker count (U1, plan §3,
# build-ci design §5.2 patch numbers), or the code is a desktop-only path never called on
# mobile. Sites gated in the same function (P1-P8, P10-P12, the pdf2htmlEX and glossary
# worker pools) need no entry; mobile_runtime.make_pool_executor itself is gated too.
# apis may not grow; count = distinct (api, line) ungated sites, may only go down.
[baseline.process_spawn_sites]
"authcd_auth:_load_claude_code_keychain_json" = { apis = ["subprocess.run"], count = 1, reason = "macOS `security` for Claude Code credential import (excluded on mobile)" }
"authcd_auth:claude_cli_auth_status" = { apis = ["subprocess.run"], count = 1, reason = "Claude Code CLI status (excluded on mobile)" }
"authcd_auth:run_claude_cli_login" = { apis = ["subprocess.Popen"], count = 1, reason = "Claude Code CLI login (excluded on mobile)" }
"authnd_auth:_mint_captcha_token_subprocess" = { apis = ["subprocess.Popen"], count = 1, reason = "QtWebEngine captcha helper process (authnd/ WebViewBridge in U9)" }
"chapter_extraction_manager:ChapterExtractionManager._run_extraction_subprocess" = { apis = ["subprocess.Popen"], count = 1, reason = "gated in the caller: TransateKRtoEN use_async_extraction requires processes_available() (P2)" }
"epub_converter:EPUBCompiler._compress_images" = { apis = ["subprocess.Popen"], count = 1, reason = "P16: `_sp.Popen` alias in a loop of `num_workers if subprocesses_available() else 0` workers -> sequential in-process fallback" }
"gemini_free:_run_search_subprocess_once" = { apis = ["subprocess.Popen"], count = 1, reason = "QtWebEngine search helper process (search/gemini WebViewBridge in U9)" }
"local_inpainter:<module>" = { apis = ["multiprocessing.Process"], count = 1, reason = "class _LocalInpainterWorker(mp.Process); only started by _start_worker (P17)" }
"local_inpainter:LocalInpainter._start_worker" = { apis = ["multiprocessing.get_context"], count = 1, reason = "P17: only called when self._mp_enabled, which requires processes_available()" }
"pdf_extractor:extract_pdf_with_formatting" = { apis = ["concurrent.futures.ProcessPoolExecutor"], count = 1, reason = "P9: _pdf_extraction_worker_count() is 1 without processes -> sequential branch" }
"pdf_fast_extractor:_extract_pdf_fast_impl" = { apis = ["concurrent.futures.ProcessPoolExecutor"], count = 1, reason = "P9: resolve_pdf_extraction_workers() is 1 without processes -> sequential branch" }
"pdf_generation_manager:PdfGenerationManager._run_pdf_subprocess" = { apis = ["subprocess.Popen"], count = 1, reason = "P14: generate_pdf_async picks _run_pdf_inprocess when not subprocesses_available()" }
"sdlxliff_extraction_manager:SdlxliffExtractionManager._run_subprocess" = { apis = ["subprocess.Popen"], count = 1, reason = "gated in the callers: TransateKRtoEN / extract_glossary_from_epub use_async requires processes_available() (P2)" }
"shutdown_utils:force_shutdown" = { apis = ["subprocess.Popen"], count = 1, reason = "desktop force-exit helper; not called on mobile" }
"shutdown_utils:popen_no_window" = { apis = ["subprocess.Popen"], count = 1, reason = "wrapper (callers are excluded modules); listed in [spawn].wrappers" }
"shutdown_utils:run_no_window" = { apis = ["subprocess.run"], count = 1, reason = "wrapper (callers are excluded modules); listed in [spawn].wrappers" }
"token_encryption:_keychain_delete_key" = { apis = ["subprocess.run"], count = 1, reason = "macOS `security` keychain; clear_encryption_keys skips it on mobile (P25 setter/file key)" }
"token_encryption:_keychain_load_key" = { apis = ["subprocess.run"], count = 1, reason = "macOS `security` keychain; _get_symmetric_key skips it on mobile (P25 setter/file key)" }
"token_encryption:_keychain_store_key" = { apis = ["subprocess.run"], count = 2, reason = "macOS `security` keychain; _get_symmetric_key skips it on mobile (P25 setter/file key)" }
"unified_api_client:UnifiedClient._probe_video_metadata" = { apis = ["subprocess.run"], count = 1, reason = "ffprobe; OSError falls back to the MP4 box parser (no edit)" }
"unified_glossary:_run_dedupe_in_subprocess" = { apis = ["concurrent.futures.ProcessPoolExecutor"], count = 1, reason = "P12: only called from _run_dedupe when processes_available()" }

