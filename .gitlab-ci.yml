# Main/MR checks; release creation dispatches Linux/mobile once.
spec:
  inputs:
    task:
      default: source-check
      options:
      - source-check
      - desktop-tests
      - mobile-check
      - desktop
      - windows
      - linux
      - macos
      - mobile
      - android
      - android-signed
      - ios
      - ios-signed
      - ios-simulator
      - android-ui
      - android-smoke
      - wheels-android
      - wheels-ios
      - mobile-backend-check
      - linux-release-repair
      description: Select mobile for the Build Mobile (Android + iOS) workflow, or
        an individual task.
    targets:
      default: all
      options:
      - all
      - android
      - ios
      description: Mobile platforms to build.
    emulator_smoke:
      type: boolean
      default: true
      description: Run Android device smoke/E2E; requires a provisioned emulator runner.
    ios_simulator_smoke:
      default: auto
      options:
      - auto
      - 'on'
      - 'off'
      description: auto follows the original required iOS simulator policy.
    ui_tests:
      default: auto
      options:
      - auto
      - 'on'
      - 'off'
      description: auto follows the original optional Android UI policy.
    android_legacy_packaging:
      type: boolean
      default: false
      description: Compress native APK libraries (original APK size experiment).
    publish:
      type: boolean
      default: false
      description: Expose a separate blocking existing-release upload job on a protected
        tag.
    signing_approved:
      type: boolean
      default: false
      description: Explicit permission for separately selected, blocking signed jobs.
    release_dispatch:
      type: boolean
      default: false
      description: Internal release receiver dispatch; only a same-project downstream
        pipeline admits it.
    release_tag:
      default: ''
      regex: ^(v[0-9]+(\.[0-9]+)+[A-Za-z0-9_.+-]*)?$
      description: Exact version tag validated by the release receiver.
    release_source_sha:
      default: ''
      regex: ^([a-f0-9]{40})?$
      description: Exact source commit validated by the release receiver.
    linux_repair_variant:
      default: standard
      options:
      - standard
      - nocuda
      - turbolite
      description: One failed Linux release variant; requires exact release tag/source
        and publish opt-in.
---
workflow:
  auto_cancel:
    on_new_commit: none
  rules:
  - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH
      == "main" && $GLOSSARION_TASK == "linux-release-repair" && $GLOSSARION_PUBLISH
      == "true" && $GLOSSARION_RELEASE_TAG && $GLOSSARION_RELEASE_SOURCE_SHA
    variables:
      GLOSSARION_RELEASE_EVENT_VALIDATED: 'true'
      GLOSSARION_SIGNING_APPROVED: 'false'
      GLOSSARION_PIPELINE_NAME: Glossarion repair $[[ inputs.release_tag ]] Linux
        $[[ inputs.linux_repair_variant ]]
  - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_BRANCH == "main" && $TRIGGER_PAYLOAD
    variables:
      GLOSSARION_TASK: release-event
      GLOSSARION_PUBLISH: 'false'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - if: $CI_PIPELINE_SOURCE == "pipeline" && $CI_COMMIT_BRANCH == "main" && $GLOSSARION_RELEASE_DISPATCH
      == "true" && $GLOSSARION_RELEASE_TAG && $GLOSSARION_RELEASE_SOURCE_SHA
    variables:
      GLOSSARION_TASK: release-builds
      GLOSSARION_TARGETS: all
      GLOSSARION_EMULATOR_SMOKE: 'true'
      GLOSSARION_IOS_SIMULATOR_SMOKE: auto
      GLOSSARION_UI_TESTS: auto
      GLOSSARION_ANDROID_LEGACY_PACKAGING: 'false'
      GLOSSARION_PUBLISH: 'true'
      GLOSSARION_SIGNING_APPROVED: 'false'
      GLOSSARION_RELEASE_EVENT_VALIDATED: 'true'
      GLOSSARION_PIPELINE_NAME: Glossarion release $[[ inputs.release_tag ]] $[[ inputs.release_source_sha
        ]]
  - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "main"
    variables:
      GLOSSARION_TASK: ci
      GLOSSARION_PUBLISH: 'false'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    variables:
      GLOSSARION_TASK: ci
      GLOSSARION_PUBLISH: 'false'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+(\.[0-9]+)+[A-Za-z0-9_.+-]*$/
    variables:
      GLOSSARION_TASK: release-wait
      GLOSSARION_PUBLISH: 'false'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/
    variables:
      GLOSSARION_TASK: tag-builds
      GLOSSARION_TARGETS: all
      GLOSSARION_EMULATOR_SMOKE: 'true'
      GLOSSARION_IOS_SIMULATOR_SMOKE: auto
      GLOSSARION_UI_TESTS: auto
      GLOSSARION_ANDROID_LEGACY_PACKAGING: 'false'
      GLOSSARION_PUBLISH: 'false'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - when: never
  name: $GLOSSARION_PIPELINE_NAME
stages:
- check
- wheels
- build
- device
- release
variables:
  GIT_DEPTH: '0'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  GLOSSARION_TASK: $[[ inputs.task ]]
  GLOSSARION_PUBLISH: $[[ inputs.publish ]]
  GLOSSARION_SIGNING_APPROVED: $[[ inputs.signing_approved ]]
  GLOSSARION_TARGETS: $[[ inputs.targets ]]
  GLOSSARION_EMULATOR_SMOKE: $[[ inputs.emulator_smoke ]]
  GLOSSARION_IOS_SIMULATOR_SMOKE: $[[ inputs.ios_simulator_smoke ]]
  GLOSSARION_UI_TESTS: $[[ inputs.ui_tests ]]
  GLOSSARION_ANDROID_LEGACY_PACKAGING: $[[ inputs.android_legacy_packaging ]]
  GLOSSARION_RELEASE_DISPATCH: $[[ inputs.release_dispatch ]]
  GLOSSARION_RELEASE_TAG: $[[ inputs.release_tag ]]
  GLOSSARION_RELEASE_SOURCE_SHA: $[[ inputs.release_source_sha ]]
  GLOSSARION_PIPELINE_NAME: Glossarion $CI_PIPELINE_SOURCE $CI_COMMIT_REF_NAME
  GLOSSARION_REPAIR_LINUX_VARIANT: $[[ inputs.linux_repair_variant ]]
default:
  interruptible: true
  before_script:
  - python -m pip install -r .gitlab/requirements.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
    - artifacts/
    - src/mobile/build/*report*.md
    - src/mobile/build/*smoke*.json
    - src/mobile/build/e2e_result.json
    - mobile-smoke-logs/
include:
- local: .gitlab/desktop.yml
- local: .gitlab/mobile.yml
source-check:
  stage: check
  tags:
  - saas-linux-small-amd64
  rules:
  - if: $GLOSSARION_TASK == "source-check"
  script:
  - python .gitlab/ci.py source-check
  - python tests/test_gitlab_ci.py
  - python tests/test_gitlab_native_environment.py
  - python tests/test_gitlab_android_platform.py
  - python tests/test_gitlab_auto_release.py
  - python tests/test_oracle_package.py
  - python tests/test_gitlab_release_event.py
  image: python:3.12-bookworm
desktop-tests:
  stage: check
  tags:
  - saas-linux-medium-amd64
  timeout: 2 hours
  rules:
  - if: $GLOSSARION_TASK == "desktop-tests" || $GLOSSARION_TASK == "ci"
  script:
  - python .gitlab/ci.py desktop-tests
  image: python:3.10-bookworm
  before_script:
  - apt-get update -qq && apt-get install -y --no-install-recommends libcairo2-dev
    pkg-config python3-dev libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1
    libfreetype6
  - python -m pip install -r .gitlab/requirements.txt
publish-existing-release:
  stage: release
  resource_group: glossarion-release
  tags:
  - saas-linux-small-amd64
  interruptible: false
  rules:
  - if: $GLOSSARION_TASK != "release-builds" && $GLOSSARION_PUBLISH == "true" && $CI_COMMIT_TAG
      && $CI_COMMIT_REF_PROTECTED == "true"
    when: manual
    allow_failure: false
  - when: never
  manual_confirmation: Upload verified build artifacts to this existing GitLab release?
  environment:
    name: gitlab-release
  script:
  - python .gitlab/release.py
  image: python:3.12-bookworm
mobile-backend-check:
  stage: check
  tags:
  - saas-linux-medium-amd64
  image: python:3.13-bookworm
  timeout: 2 hours
  before_script:
  - python -m pip install -r .gitlab/requirements.txt uv
  rules:
  - if: $GLOSSARION_TASK == "ci" || $GLOSSARION_TASK == "mobile-backend-check"
  script:
  - python .gitlab/ci.py mobile-backend-check
publish-version-release:
  stage: release
  tags:
  - saas-linux-small-amd64
  image: python:3.12-bookworm
  before_script:
  - if [ "${GLOSSARION_RELEASE_EVENT_VALIDATED:-false}" = "true" ]; then python3 .gitlab/release_event.py
    checkout || exit 1; export CI_COMMIT_SHA="$GLOSSARION_RELEASE_SOURCE_SHA" CI_COMMIT_TAG="$GLOSSARION_RELEASE_TAG"
    CI_COMMIT_REF_NAME="$GLOSSARION_RELEASE_TAG"; fi
  timeout: 30 minutes
  interruptible: false
  resource_group: glossarion-release
  rules:
  - if: $GLOSSARION_TASK == "release-builds" && $GLOSSARION_PUBLISH == "true" && $GLOSSARION_RELEASE_TAG
    when: always
  - when: never
  dependencies:
  - linux-build
  - android-apk
  - ios-unsigned
  script:
  - python .gitlab/auto_release.py
release-tag-ready:
  stage: check
  tags:
  - saas-linux-small-amd64
  image: python:3.12-bookworm
  before_script: []
  timeout: 5 minutes
  rules:
  - if: $GLOSSARION_TASK == "release-wait"
  script:
  - echo "Version tag is ready. Creating its GitLab release starts one Linux/mobile
    build pipeline."
release-event-dispatch:
  stage: check
  tags:
  - saas-linux-small-amd64
  image: python:3.12-bookworm
  before_script: []
  timeout: 10 minutes
  interruptible: false
  resource_group: glossarion-release-dispatch
  rules:
  - if: $GLOSSARION_TASK == "release-event"
  script:
  - python .gitlab/release_event.py
  artifacts:
    when: always
    expire_in: 7 days
    paths:
    - artifacts/release-event/
linux-release-repair:
  stage: build
  tags:
  - saas-linux-medium-amd64
  image: python:3.12-bookworm
  timeout: 3 hours
  interruptible: false
  resource_group: glossarion-linux-repair-$GLOSSARION_REPAIR_LINUX_VARIANT
  rules:
  - if: $GLOSSARION_TASK == "linux-release-repair"
  before_script:
  - python3 .gitlab/release_event.py checkout
  - export CI_COMMIT_SHA="$GLOSSARION_RELEASE_SOURCE_SHA" CI_COMMIT_TAG="$GLOSSARION_RELEASE_TAG"
    CI_COMMIT_REF_NAME="$GLOSSARION_RELEASE_TAG"
  - source .gitlab/setup_desktop_linux.sh
  script:
  - python .gitlab/ci.py desktop --platform linux --variant "$GLOSSARION_REPAIR_LINUX_VARIANT"
  - python .gitlab/auto_release.py
