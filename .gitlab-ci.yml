# Main/MR checks and version-tag release builds; manual signing stays gated.
spec:
  inputs:
    task:
      default: source-check
      options:
      - source-check
      - desktop-tests
      - mobile-check
      - desktop
      - windows
      - linux
      - macos
      - mobile
      - android
      - android-signed
      - ios
      - ios-signed
      - ios-simulator
      - android-ui
      - android-smoke
      - wheels-android
      - wheels-ios
      - mobile-backend-check
      description: Select mobile for the Build Mobile (Android + iOS) workflow, or
        an individual task.
    targets:
      default: all
      options:
      - all
      - android
      - ios
      description: Mobile platforms to build.
    emulator_smoke:
      type: boolean
      default: true
      description: Run Android device smoke/E2E; requires a provisioned emulator runner.
    ios_simulator_smoke:
      default: auto
      options:
      - auto
      - 'on'
      - 'off'
      description: auto follows the original required iOS simulator policy.
    ui_tests:
      default: auto
      options:
      - auto
      - 'on'
      - 'off'
      description: auto follows the original optional Android UI policy.
    android_legacy_packaging:
      type: boolean
      default: false
      description: Compress native APK libraries (original APK size experiment).
    publish:
      type: boolean
      default: false
      description: Expose a separate blocking existing-release upload job on a protected
        tag.
    signing_approved:
      type: boolean
      default: false
      description: Explicit permission for separately selected, blocking signed jobs.
---
workflow:
  auto_cancel:
    on_new_commit: none
  rules:
  - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
      == "main"
    variables:
      GLOSSARION_TASK: ci
      GLOSSARION_PUBLISH: 'false'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
    variables:
      GLOSSARION_TASK: ci
      GLOSSARION_PUBLISH: 'false'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+(\.[0-9]+)+[A-Za-z0-9_.+-]*$/
    variables:
      GLOSSARION_TASK: release-builds
      GLOSSARION_TARGETS: all
      GLOSSARION_EMULATOR_SMOKE: 'true'
      GLOSSARION_IOS_SIMULATOR_SMOKE: auto
      GLOSSARION_UI_TESTS: auto
      GLOSSARION_ANDROID_LEGACY_PACKAGING: 'false'
      GLOSSARION_PUBLISH: 'true'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v/
    variables:
      GLOSSARION_TASK: tag-builds
      GLOSSARION_TARGETS: all
      GLOSSARION_EMULATOR_SMOKE: 'true'
      GLOSSARION_IOS_SIMULATOR_SMOKE: auto
      GLOSSARION_UI_TESTS: auto
      GLOSSARION_ANDROID_LEGACY_PACKAGING: 'false'
      GLOSSARION_PUBLISH: 'false'
      GLOSSARION_SIGNING_APPROVED: 'false'
  - when: never
stages:
- check
- wheels
- build
- device
- release
variables:
  GIT_DEPTH: '0'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  GLOSSARION_TASK: $[[ inputs.task ]]
  GLOSSARION_PUBLISH: $[[ inputs.publish ]]
  GLOSSARION_SIGNING_APPROVED: $[[ inputs.signing_approved ]]
  GLOSSARION_TARGETS: $[[ inputs.targets ]]
  GLOSSARION_EMULATOR_SMOKE: $[[ inputs.emulator_smoke ]]
  GLOSSARION_IOS_SIMULATOR_SMOKE: $[[ inputs.ios_simulator_smoke ]]
  GLOSSARION_UI_TESTS: $[[ inputs.ui_tests ]]
  GLOSSARION_ANDROID_LEGACY_PACKAGING: $[[ inputs.android_legacy_packaging ]]
default:
  interruptible: true
  before_script:
  - python -m pip install -r .gitlab/requirements.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
    - artifacts/
    - src/mobile/build/*report*.md
    - src/mobile/build/*smoke*.json
    - src/mobile/build/e2e_result.json
    - mobile-smoke-logs/
include:
- local: .gitlab/desktop.yml
- local: .gitlab/mobile.yml
source-check:
  stage: check
  tags:
  - saas-linux-small-amd64
  rules:
  - if: $GLOSSARION_TASK == "source-check"
  script:
  - python .gitlab/ci.py source-check
  - python tests/test_gitlab_ci.py
  - python tests/test_gitlab_native_environment.py
  - python tests/test_gitlab_android_platform.py
  - python tests/test_gitlab_auto_release.py
  - python tests/test_oracle_package.py
  image: python:3.12-bookworm
desktop-tests:
  stage: check
  tags:
  - saas-linux-medium-amd64
  timeout: 2 hours
  rules:
  - if: $GLOSSARION_TASK == "desktop-tests" || $GLOSSARION_TASK == "ci"
  script:
  - python .gitlab/ci.py desktop-tests
  image: python:3.10-bookworm
  before_script:
  - apt-get update -qq && apt-get install -y --no-install-recommends libcairo2-dev
    pkg-config python3-dev libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1
    libfreetype6
  - python -m pip install -r .gitlab/requirements.txt
publish-existing-release:
  stage: release
  resource_group: glossarion-release
  tags:
  - saas-linux-small-amd64
  interruptible: false
  rules:
  - if: $GLOSSARION_TASK != "release-builds" && $GLOSSARION_PUBLISH == "true" && $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED
      == "true"
    when: manual
    allow_failure: false
  - when: never
  manual_confirmation: Upload verified build artifacts to this existing GitLab release?
  environment:
    name: gitlab-release
  script:
  - python .gitlab/release.py
  image: python:3.12-bookworm
mobile-backend-check:
  stage: check
  tags:
  - saas-linux-medium-amd64
  image: python:3.13-bookworm
  timeout: 2 hours
  before_script:
  - python -m pip install -r .gitlab/requirements.txt uv
  rules:
  - if: $GLOSSARION_TASK == "ci" || $GLOSSARION_TASK == "mobile-backend-check"
  script:
  - python .gitlab/ci.py mobile-backend-check

publish-version-release:
  stage: release
  tags:
  - saas-linux-small-amd64
  image: python:3.12-bookworm
  before_script: []
  timeout: 30 minutes
  interruptible: false
  resource_group: glossarion-release
  rules:
  - if: $GLOSSARION_TASK == "release-builds" && $GLOSSARION_PUBLISH == "true" && $CI_COMMIT_TAG
    when: always
  - when: never
  dependencies:
  - linux-build
  - android-apk
  - ios-unsigned
  script:
  - python .gitlab/auto_release.py
