# GitHub Pages (legacy Jekyll build from main) publishes the whole repository unless told otherwise.
# The site is only index.html, help/, webtoons/ and assets/site/; everything else is excluded so the
# deploy stays small (it timed out at ~300 MB on 2026-11-07, three times, at "syncing_files").
# A new top-level folder or a new file directly in assets/ needs a line here too.
exclude:
  - LICENSE
  - README.md
  - build_msix.bat
  - docs
  - extension
  - install_requirements.bat
  - requirements-macos.txt
  - requirements.txt
  - requirements_Cuda.txt
  - requirements_NoCuda.txt
  - src
  - tests
  - tools
  - assets/Chikuwa
