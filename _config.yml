# GitHub Pages serves index.html, help/, webtoons/, and assets/site/.
# Keep the original artwork outside the site bundle. New artwork under assets/
# should use a capitalized name so Jekyll excludes it with the rest.
exclude:
  - LICENSE
  - README.md
  - build_msix.bat
  - docs
  - extension
  - install_requirements.bat
  - requirements-macos.txt
  - requirements.txt
  - requirements_Cuda.txt
  - requirements_NoCuda.txt
  - src
  - tests
  - tools
  - "assets/[A-Z]*"
  - assets/illya
