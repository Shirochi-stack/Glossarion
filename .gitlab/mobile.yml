mobile-check:
  stage: check
  tags:
  - saas-linux-medium-amd64
  timeout: 2 hours
  rules:
  - if: $GLOSSARION_TASK == "mobile-check"
  script:
  - python .gitlab/ci.py mobile-check
  image: python:3.13-bookworm
  before_script:
  - python -m pip install -r .gitlab/requirements.txt uv
wheels-android:
  stage: wheels
  tags:
  - saas-linux-medium-amd64
  timeout: 2 hours
  rules:
  - if: $GLOSSARION_TASK =~ /^(android|android-signed|android-ui|android-smoke|wheels-android)$/
      || ($GLOSSARION_TASK == "mobile" && ($GLOSSARION_TARGETS == "all" || $GLOSSARION_TARGETS
      == "android"))
  script:
  - python .gitlab/ci.py wheels --platform android
  image: python:3.13-bookworm
  before_script:
  - source .gitlab/setup_android.sh
  - python -m pip install -r .gitlab/requirements.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
    - artifacts/wheelhouse-android/
    - artifacts/wheels-android/
    - .gitlab-work/wheels-android/forge/logs/
  needs: []
wheels-ios:
  stage: wheels
  tags:
  - saas-macos-medium-m1
  timeout: 2 hours
  rules:
  - if: $GLOSSARION_TASK =~ /^(ios|ios-signed|ios-simulator|wheels-ios)$/ || ($GLOSSARION_TASK
      == "mobile" && ($GLOSSARION_TARGETS == "all" || $GLOSSARION_TARGETS == "ios"))
  script:
  - python .gitlab/ci.py wheels --platform ios
  image: macos-26-xcode-26
  before_script:
  - source .gitlab/setup_ios.sh
  - python -m pip install -r .gitlab/requirements.txt
  needs: []
android-apk:
  stage: build
  tags:
  - saas-linux-medium-amd64
  needs:
  - wheels-android
  - job: mobile-prepare
    optional: true
    artifacts: true
  timeout: 4 hours
  rules:
  - if: $GLOSSARION_TASK == "android" || $GLOSSARION_TASK == "android-smoke" || ($GLOSSARION_TASK
      == "mobile" && ($GLOSSARION_TARGETS == "all" || $GLOSSARION_TARGETS == "android"))
  script:
  - python .gitlab/ci.py mobile --target apk
  image: python:3.13-bookworm
  before_script:
  - source .gitlab/setup_android.sh
  - python -m pip install -r .gitlab/requirements.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
    - artifacts/mobile-apk/
    - artifacts/mobile-aab/
    - src/mobile/build/*report*.md
    - build/apk_size*
android-signed:
  stage: build
  tags:
  - saas-linux-medium-amd64
  needs:
  - wheels-android
  timeout: 4 hours
  interruptible: false
  rules:
  - if: $GLOSSARION_TASK == "android-signed"
    when: manual
    allow_failure: false
  manual_confirmation: Use the provisioned Android signing key to build APK/AAB artifacts?
  environment:
    name: android-signing
  script:
  - python .gitlab/ci.py mobile --target apk --signed
  - python .gitlab/ci.py mobile --target aab --signed
  image: python:3.13-bookworm
  before_script:
  - source .gitlab/setup_android.sh
  - python -m pip install -r .gitlab/requirements.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
    - artifacts/mobile-apk/
    - artifacts/mobile-aab/
    - src/mobile/build/*report*.md
    - build/apk_size*
ios-unsigned:
  stage: build
  tags:
  - saas-macos-medium-m1
  needs:
  - wheels-ios
  - job: mobile-prepare
    optional: true
    artifacts: true
  timeout: 4 hours
  rules:
  - if: $GLOSSARION_TASK == "ios" || ($GLOSSARION_TASK == "mobile" && ($GLOSSARION_TARGETS
      == "all" || $GLOSSARION_TARGETS == "ios"))
  script:
  - python .gitlab/ci.py mobile --target ipa
  image: macos-26-xcode-26
  before_script:
  - source .gitlab/setup_ios.sh
  - python -m pip install -r .gitlab/requirements.txt
ios-signed:
  stage: build
  tags:
  - saas-macos-medium-m1
  needs:
  - wheels-ios
  timeout: 4 hours
  interruptible: false
  rules:
  - if: $GLOSSARION_TASK == "ios-signed"
    when: manual
    allow_failure: false
  manual_confirmation: Use the pre-provisioned Apple signing identity and profile
    to build this IPA?
  environment:
    name: ios-signing
  script:
  - python .gitlab/ci.py mobile --target ipa --signed
  image: macos-26-xcode-26
  before_script:
  - source .gitlab/setup_ios.sh
  - python -m pip install -r .gitlab/requirements.txt
ios-simulator:
  stage: build
  tags:
  - saas-macos-medium-m1
  needs:
  - wheels-ios
  - job: mobile-prepare
    optional: true
    artifacts: true
  timeout: 4 hours
  rules:
  - if: $GLOSSARION_TASK == "ios-simulator" || ($GLOSSARION_TASK == "mobile" && ($GLOSSARION_TARGETS
      == "all" || $GLOSSARION_TARGETS == "ios") && ($GLOSSARION_IOS_SIMULATOR_SMOKE
      == "on" || $GLOSSARION_IOS_SIMULATOR_SMOKE == "auto"))
  script:
  - python .gitlab/ci.py mobile --target ios-simulator
  image: macos-26-xcode-26
  before_script:
  - source .gitlab/setup_ios.sh
  - python -m pip install -r .gitlab/requirements.txt
android-ui:
  stage: device
  tags:
  - saas-linux-medium-amd64
  needs:
  - wheels-android
  timeout: 4 hours
  rules:
  - if: $GLOSSARION_TASK == "mobile" && ($GLOSSARION_TARGETS == "all" || $GLOSSARION_TARGETS
      == "android") && $GLOSSARION_UI_TESTS == "on"
    allow_failure: true
  - if: $GLOSSARION_TASK == "android-ui"
  script:
  - python .gitlab/ci.py android-ui
  image: python:3.13-bookworm
  before_script:
  - source .gitlab/setup_emulator.sh
  - python -m pip install -r .gitlab/requirements.txt
android-smoke:
  stage: device
  tags:
  - saas-linux-medium-amd64
  needs:
  - android-apk
  timeout: 1 hour
  rules:
  - if: $GLOSSARION_TASK == "android-smoke" || ($GLOSSARION_TASK == "mobile" && ($GLOSSARION_TARGETS
      == "all" || $GLOSSARION_TARGETS == "android") && $GLOSSARION_EMULATOR_SMOKE
      == "true")
  script:
  - python .gitlab/ci.py android-smoke
  image: python:3.13-bookworm
  before_script:
  - source .gitlab/setup_emulator.sh
  - python -m pip install -r .gitlab/requirements.txt
mobile-prepare:
  stage: check
  tags:
  - saas-linux-medium-amd64
  image: python:3.13-bookworm
  before_script:
  - python -m pip install -r .gitlab/requirements.txt uv
  timeout: 2 hours
  rules:
  - if: $GLOSSARION_TASK == "mobile"
  script:
  - python .gitlab/ci.py mobile-check
  artifacts:
    when: always
    expire_in: 1 day
    paths:
    - artifacts/mobile-check/
    - src/mobile/app/backend/
    - src/mobile/app/assets/tiktoken/
    - src/mobile/app/assets/selftest/
    - src/mobile/build/*report*.md
    - src/mobile/build/host_smoke*.json
    - src/mobile/build/e2e_result.json
    exclude:
    - src/mobile/app/**/__pycache__/**
