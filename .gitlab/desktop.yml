windows-build:
  stage: build
  tags:
  - saas-windows-medium-amd64
  timeout: 4 hours
  rules:
  - if: $GLOSSARION_TASK == "windows" || $GLOSSARION_TASK == "desktop"
  parallel:
    matrix:
    - VARIANT:
      - lite
      - nocuda
      - turbolite
      - main
      - heavy
  script:
  - python .gitlab/ci.py desktop --platform windows --variant $env:VARIANT
  before_script:
  - . .gitlab/setup_desktop_windows.ps1
linux-build:
  stage: build
  tags:
  - saas-linux-medium-amd64
  timeout: 3 hours
  rules:
  - if: $GLOSSARION_TASK == "linux" || $GLOSSARION_TASK == "desktop" || $GLOSSARION_TASK
      == "tag-builds" || $GLOSSARION_TASK == "release-builds"
  parallel:
    matrix:
    - VARIANT:
      - standard
      - nocuda
      - turbolite
  script:
  - python .gitlab/ci.py desktop --platform linux --variant "$VARIANT"
  needs: []
  image: python:3.12-bookworm
  before_script:
  - source .gitlab/setup_desktop_linux.sh
macos-arm-build:
  stage: build
  tags:
  - saas-macos-medium-m1
  timeout: 3 hours
  rules:
  - if: $GLOSSARION_TASK == "macos" || $GLOSSARION_TASK == "desktop" || $GLOSSARION_TASK
      == "tag-builds"
  parallel:
    matrix:
    - VARIANT:
      - lite
      - nocuda
  script:
  - python .gitlab/ci.py desktop --platform macos-arm --variant "$VARIANT"
  needs: []
  image: macos-26-xcode-26
  variables:
    DESKTOP_ARCH: arm64
  before_script:
  - source .gitlab/setup_desktop_macos.sh
macos-intel-build:
  stage: build
  tags:
  - saas-macos-medium-m1
  timeout: 3 hours
  rules:
  - if: $GLOSSARION_TASK == "macos" || $GLOSSARION_TASK == "desktop" || $GLOSSARION_TASK
      == "tag-builds"
  parallel:
    matrix:
    - VARIANT:
      - lite
      - nocuda
  script:
  - python .gitlab/ci.py desktop --platform macos-intel --variant "$VARIANT"
  needs: []
  image: macos-26-xcode-26
  variables:
    DESKTOP_ARCH: x86_64
  before_script:
  - source .gitlab/setup_desktop_macos.sh
