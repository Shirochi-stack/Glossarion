# TEMPORARY: regenerates src/mobile/uv.lock on the Linux runner (uv + Python 3.13), because the
# owner's PC cannot run an unsigned uv or Python 3.13 (Smart App Control). Runs only on the
# ai-sdk-upgrade branch and is deleted in the next commit.
name: Regenerate mobile uv.lock (temporary)

on:
  push:
    branches: [ai-sdk-upgrade]
    paths:
      - .github/workflows/regen-mobile-lock.yml
      - src/mobile/pyproject.toml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-sdk-upgrade

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'

      - name: uv lock
        working-directory: src/mobile
        run: |
          uv --version
          uv lock
          git diff --stat -- uv.lock
          grep -A1 -E '^name = "(openai|anthropic|google-genai|httpx2|httpcore2|truststore|jiter|deepl|tiktoken|google-auth)"$' uv.lock

      - name: Commit and push uv.lock
        run: |
          if git diff --quiet -- src/mobile/uv.lock; then
            echo "uv.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mobile/uv.lock
          git commit -m "Mobile: regenerate uv.lock for the new SDK pins (uv lock on CI, Python 3.13)"
          git push origin HEAD:ai-sdk-upgrade
