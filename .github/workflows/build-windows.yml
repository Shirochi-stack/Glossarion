      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements_NoCuda.txt
      
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          cd src
