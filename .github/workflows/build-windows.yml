      - name: Upload Windows NoCuda artifact
        id: unsigned-windows
        uses: actions/upload-artifact@v4
        with:
          name: Z_Glossarion-NoCuda-Windows
          path: src/dist/*.exe
          if-no-files-found: error

      - name: Test sign Windows NoCuda with SignPath
        if: ${{ inputs.test_signing }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '6a2f04e5-f9ae-44a0-9f80-f1191d07e51d'
          project-slug: 'Glossarion'
          signing-policy-slug: 'test-signing'
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: 'signed-windows'

      - name: Upload test-signed Windows NoCuda artifact
        if: ${{ inputs.test_signing }}
        uses: actions/upload-artifact@v4
        with:
          name: Z_Glossarion-NoCuda-Windows-TEST-SIGNED
          path: signed-windows/*.exe
          if-no-files-found: error

