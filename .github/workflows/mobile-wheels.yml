# Self-built mobile wheels for the security pins: cryptography 50.0.2 (Android + iOS) and Pillow
# 12.3.0 (Android), and the on-device engine with vision: llama-cpp-python 0.3.32 with libmtmd
# (Android + iOS; pypi.flet.dev's builds lack libmtmd). No index or release has Android/iOS cp313
# wheels for these, so this
# workflow builds them with flet-dev/mobile-forge (pinned in src/mobile/ci/wheels/wheelhouse.toml),
# verifies them and uploads them as the artifact mobile-wheelhouse-<platform>. build-mobile.yml
# calls it once per platform and hands the wheels to `flet build` through PIP_FIND_LINKS
# (.github/actions/mobile-wheelhouse).
#
# Triggers: workflow_call and workflow_dispatch only. It never publishes: no release, no index
# upload, no secrets. Finished wheels are cached (actions/cache, exact keys over the manifest,
# the build scripts and the recipe) and rebuilt on a key change, after 7 idle days, or with
# fresh=true. Cache entries are written only after both verification steps pass.
#
# Outputs: artifact mobile-wheelhouse-<platform> (wheels + SHA256SUMS + provenance.json, 7 days);
# on failure, mobile-wheels-logs-<platform> (forge logs, 14 days).
#
# cpu_check (dispatch only, android): job arm64-cpu-variants builds the same llama-cpp-python sdist
# and patch on a Linux arm64 runner with the Android arm64 build's four CPU variants and runs
# src/mobile/ci/wheels/cpu_variants_check.py: the variant the patched loader picks natively, tokens/s
# per variant, and under qemu-aarch64 that a Cortex-A53 gets the armv8.0 baseline without SIGILL
# (the Android libraries themselves need bionic, so no runner can load them).

name: Mobile wheels (cryptography, Pillow, llama-cpp-python)

on:
  workflow_call:
    inputs:
      platform:
        description: android or ios
        type: string
        required: true
      fresh:
        description: Ignore the wheel cache and build again
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios]
        default: android
      fresh:
        description: Ignore the wheel cache and build again
        type: boolean
        default: true
      cpu_check:
        description: Also check the engine's runtime CPU variants on Linux arm64 + qemu (android)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: Build mobile wheels (${{ inputs.platform }})
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    # llama.cpp + libmtmd per ABI / iOS slice is the long part (cached afterwards)
    timeout-minutes: 120
    env:
      PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Check inputs
        run: |
          case "$PLATFORM" in
            android|ios) ;;
            *) echo "::error title=Invalid input::platform must be android or ios (got '$PLATFORM')"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: false

      - name: Pinned inputs
        id: pins
        run: |
          {
            echo "WHEELHOUSE=$RUNNER_TEMP/wheelhouse"
            echo "WHEELCACHE=$RUNNER_TEMP/wheelcache"
            echo "FORGE_DIR=$RUNNER_TEMP/forge"
          } >> "$GITHUB_ENV"
          uv run --no-project python src/mobile/ci/wheels/wheels.py env --platform "$PLATFORM" --format github | tee -a "$GITHUB_OUTPUT"
          # The cache steps below are written per package; fail if the manifest moved on without them.
          case "$PLATFORM" in
            android) expected="cryptography pillow llama-cpp-python" ;;
            *) expected="cryptography llama-cpp-python" ;;
          esac
          packages="$(uv run --no-project python src/mobile/ci/wheels/wheels.py packages --platform "$PLATFORM")"
          if [ "$packages" != "$expected" ]; then
            echo "::error title=Mobile wheels::wheelhouse.toml builds '$packages' for $PLATFORM, but this workflow caches '$expected'. Update .github/workflows/mobile-wheels.yml."
            exit 1
          fi

      - name: Restore cached cryptography wheels
        id: cache-cryptography
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/wheelcache/cryptography
          key: mobile-wheels-v1-${{ inputs.platform }}-cryptography-${{ hashFiles('src/mobile/ci/wheels/wheelhouse.toml', 'src/mobile/ci/wheels/build_wheels.sh', 'src/mobile/ci/wheels/wheels.py', 'src/mobile/ci/wheels/recipes/cryptography/**') }}

      - name: Restore cached Pillow wheels
        id: cache-pillow
        if: ${{ !inputs.fresh && inputs.platform == 'android' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/wheelcache/pillow
          key: mobile-wheels-v1-${{ inputs.platform }}-pillow-${{ hashFiles('src/mobile/ci/wheels/wheelhouse.toml', 'src/mobile/ci/wheels/build_wheels.sh', 'src/mobile/ci/wheels/wheels.py', 'src/mobile/ci/wheels/recipes/pillow/**') }}

      - name: Restore cached llama-cpp-python wheels
        id: cache-llama-cpp-python
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/wheelcache/llama-cpp-python
          key: mobile-wheels-v1-${{ inputs.platform }}-llama-cpp-python-${{ hashFiles('src/mobile/ci/wheels/wheelhouse.toml', 'src/mobile/ci/wheels/build_wheels.sh', 'src/mobile/ci/wheels/wheels.py', 'src/mobile/ci/wheels/recipes/llama-cpp-python/**') }}

      - name: Packages to build
        id: todo
        env:
          HIT_CRYPTOGRAPHY: ${{ steps.cache-cryptography.outputs.cache-hit }}
          HIT_PILLOW: ${{ steps.cache-pillow.outputs.cache-hit }}
          HIT_LLAMA: ${{ steps.cache-llama-cpp-python.outputs.cache-hit }}
        run: |
          todo=""
          if [ "$HIT_CRYPTOGRAPHY" != true ]; then todo="cryptography"; fi
          if [ "$PLATFORM" = android ] && [ "$HIT_PILLOW" != true ]; then todo="${todo:+$todo }pillow"; fi
          if [ "$HIT_LLAMA" != true ]; then todo="${todo:+$todo }llama-cpp-python"; fi
          echo "packages=$todo" | tee -a "$GITHUB_OUTPUT"
          if [ -z "$todo" ]; then
            echo "All wheels for $PLATFORM come from the cache." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Free disk space (Android)
        if: inputs.platform == 'android' && steps.todo.outputs.packages != ''
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Android toolchain (apt packages, Rust)
        if: inputs.platform == 'android' && steps.todo.outputs.packages != ''
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust_version }}
          RUST_TARGETS: ${{ steps.pins.outputs.rust_targets }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config sqlite3
          # `rustup default`, not RUSTUP_TOOLCHAIN: forge builds the compile environment from scratch
          # (keeping HOME), so only rustup's default toolchain reaches cargo there.
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$RUST_TARGETS"
          rustup default "$RUST_VERSION"
          rustc -V

      - name: Select Xcode
        if: inputs.platform == 'ios' && steps.todo.outputs.packages != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: iOS toolchain (Rust)
        if: inputs.platform == 'ios' && steps.todo.outputs.packages != ''
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust_version }}
          RUST_TARGETS: ${{ steps.pins.outputs.rust_targets }}
        run: |
          # As on Android: only rustup's default toolchain reaches forge's build environment. The
          # iOS deployment target (13.0) is set in the recipe's script_env for the same reason.
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$RUST_TARGETS"
          rustup default "$RUST_VERSION"
          rustc -V
          xcodebuild -version

      - name: Build wheels (mobile-forge)
        if: steps.todo.outputs.packages != ''
        env:
          PACKAGES: ${{ steps.todo.outputs.packages }}
        run: |
          read -r -a packages <<< "$PACKAGES"
          bash src/mobile/ci/wheels/build_wheels.sh "$PLATFORM" "${packages[@]}"

      - name: Assemble the wheelhouse
        run: uv run --no-project python src/mobile/ci/wheels/wheels.py assemble --platform "$PLATFORM" --cache "$WHEELCACHE" --out "$WHEELHOUSE"

      - name: Verify the wheelhouse (structure, pins, uv.lock)
        run: uv run --no-project python src/mobile/tools/check_mobile_wheels.py --verify-wheelhouse "$WHEELHOUSE" --platform "$PLATFORM" --report "$RUNNER_TEMP/wheelhouse_check.md"

      # Also checks every import of cryptography's _rust module. On Android those resolve against
      # the NDK's API-24 stub libraries: $ANDROID_HOME/ndk/<toolchain.android_ndk>, preinstalled on
      # ubuntu-24.04 (so a cache hit needs no toolchain step); without it the step fails closed.
      - name: Verify the wheelhouse (native binaries)
        run: uv run --no-project python src/mobile/ci/wheels/wheels.py verify-native --platform "$PLATFORM" "$WHEELHOUSE"

      - name: Save cryptography wheels to the cache
        if: success() && contains(steps.todo.outputs.packages, 'cryptography')
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/wheelcache/cryptography
          key: mobile-wheels-v1-${{ inputs.platform }}-cryptography-${{ hashFiles('src/mobile/ci/wheels/wheelhouse.toml', 'src/mobile/ci/wheels/build_wheels.sh', 'src/mobile/ci/wheels/wheels.py', 'src/mobile/ci/wheels/recipes/cryptography/**') }}

      - name: Save Pillow wheels to the cache
        if: success() && contains(steps.todo.outputs.packages, 'pillow')
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/wheelcache/pillow
          key: mobile-wheels-v1-${{ inputs.platform }}-pillow-${{ hashFiles('src/mobile/ci/wheels/wheelhouse.toml', 'src/mobile/ci/wheels/build_wheels.sh', 'src/mobile/ci/wheels/wheels.py', 'src/mobile/ci/wheels/recipes/pillow/**') }}

      - name: Save llama-cpp-python wheels to the cache
        if: success() && contains(steps.todo.outputs.packages, 'llama-cpp-python')
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/wheelcache/llama-cpp-python
          key: mobile-wheels-v1-${{ inputs.platform }}-llama-cpp-python-${{ hashFiles('src/mobile/ci/wheels/wheelhouse.toml', 'src/mobile/ci/wheels/build_wheels.sh', 'src/mobile/ci/wheels/wheels.py', 'src/mobile/ci/wheels/recipes/llama-cpp-python/**') }}

      - name: Write provenance
        env:
          PACKAGES: ${{ steps.todo.outputs.packages }}
        run: uv run --no-project python src/mobile/ci/wheels/wheels.py provenance --platform "$PLATFORM" --wheelhouse "$WHEELHOUSE" --cache "$WHEELCACHE" --built "$PACKAGES"

      - name: Upload the wheelhouse
        uses: actions/upload-artifact@v7
        with:
          name: mobile-wheelhouse-${{ inputs.platform }}
          path: ${{ runner.temp }}/wheelhouse/
          if-no-files-found: error
          retention-days: 7

      - name: Upload forge logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-wheels-logs-${{ inputs.platform }}
          path: |
            ${{ runner.temp }}/forge/logs/
            ${{ runner.temp }}/forge/errors/
          if-no-files-found: warn
          retention-days: 14

  arm64-cpu-variants:
    name: Engine CPU variants (Linux arm64 + qemu)
    if: inputs.platform == 'android' && inputs.cpu_check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      # Qwen2.5 0.5B Instruct GGUF at a fixed revision (Q4_0: the repacked i8mm path; Q4_K_M: the usual quant)
      MODEL_REPO: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67
      Q4_0_SHA256: 7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed
      Q4_K_M_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv (Python 3.13)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: false

      - name: Toolchain (cmake, ninja, qemu-user)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qemu-user patch
          qemu-aarch64 --version | head -1
          grep -m1 -i '^features' /proc/cpuinfo

      - name: Build llama-cpp-python with the Android arm64 CPU variants
        run: |
          read -r url sha < <(uv run --no-project python -c 'import tomllib; d = tomllib.load(open("src/mobile/ci/wheels/wheelhouse.toml", "rb")); w = [w for w in d["wheel"] if w["name"] == "llama-cpp-python"][0]; print(w["sdist_url"], w["sdist_sha256"])')
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/llama.tar.gz"
          echo "$sha  $RUNNER_TEMP/llama.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/llama-src"
          tar xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP/llama-src" --strip-components=1
          patch -d "$RUNNER_TEMP/llama-src" -p1 --ignore-whitespace --input "$GITHUB_WORKSPACE/src/mobile/ci/wheels/recipes/llama-cpp-python/patches/mobile.patch"
          uv venv "$RUNNER_TEMP/venv" --python 3.13
          # The recipe's Android arm64 CMake arguments, plus the option that builds the Android variant
          # set on Linux (mobile.patch 7.).
          export CMAKE_ARGS="-DLLAVA_BUILD=ON -DMTMD_VIDEO=OFF -DCMAKE_INSTALL_LIBDIR=llama_cpp/lib -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF -DGGML_BLAS=OFF -DGGML_METAL=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_OPENCL=OFF -DGGML_RPC=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DCMAKE_INSTALL_BINDIR=llama_cpp/lib -DGLOSSARION_ANDROID_CPU_VARIANTS=ON"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -v "$RUNNER_TEMP/llama-src" 2>&1 | tail -n 60
          ls -l "$("$RUNNER_TEMP/venv/bin/python" -c 'import importlib.util, pathlib; print(pathlib.Path(importlib.util.find_spec("llama_cpp").origin).parent / "lib")')"

      - name: Download the test models
        run: |
          curl -fsSL --retry 3 "$MODEL_REPO/qwen2.5-0.5b-instruct-q4_0.gguf" -o "$RUNNER_TEMP/q4_0.gguf"
          curl -fsSL --retry 3 "$MODEL_REPO/qwen2.5-0.5b-instruct-q4_k_m.gguf" -o "$RUNNER_TEMP/q4_k_m.gguf"
          printf '%s  %s\n%s  %s\n' "$Q4_0_SHA256" "$RUNNER_TEMP/q4_0.gguf" "$Q4_K_M_SHA256" "$RUNNER_TEMP/q4_k_m.gguf" | sha256sum -c -

      - name: Check the CPU variants (native benchmark, qemu Cortex-A53 / A76)
        run: |
          "$RUNNER_TEMP/venv/bin/python" src/mobile/ci/wheels/cpu_variants_check.py run \
            --model "$RUNNER_TEMP/q4_0.gguf" --bench-model "$RUNNER_TEMP/q4_0.gguf" --bench-model "$RUNNER_TEMP/q4_k_m.gguf" \
            --json "$RUNNER_TEMP/cpu_variants.json" --summary "$RUNNER_TEMP/cpu_variants.md"

      - name: Report
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/cpu_variants.md" ] && cat "$RUNNER_TEMP/cpu_variants.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-cpu-variants-report
          path: ${{ runner.temp }}/cpu_variants.*
          if-no-files-found: warn
          retention-days: 14
